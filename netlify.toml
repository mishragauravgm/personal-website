[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.147.2"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  HUGO_BASEURL = "https://gmishra.in"

[context.deploy-preview.environment]
  HUGO_BASEURL = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Handle Hugo's clean URLs
[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301

# Handle trailing slashes
[[redirects]]
  from = "/*/"
  to = "/:splat/index.html"
  status = 200
